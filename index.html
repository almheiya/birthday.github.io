
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>

            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],

                    colors: {

                            950: '#050507',

    <style>
        body {
            background: radial-gradient(circle at center, #12121e 0%, #050507 100%);
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Gold Text Glow */
        .text-glow {
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.4), 0 0 30px rgba(234, 179, 8, 0.2);
        }

        /* Glassmorphic Card */
        .glass-card {
            background: rgba(13, 14, 22, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.22);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(234, 179, 8, 0.1);
        }

        /* Candle Flame Flickering */
        .flame {
            animation: flameFlicker 1.1s infinite alternate ease-in-out;
            transform-origin: center bottom;
            filter: drop-shadow(0px -2px 6px #f59e0b) drop-shadow(0px -5px 12px #f43f5e);
            cursor: pointer;
        }

        @keyframes flameFlicker {
            0% { transform: scale(0.95) rotate(-2deg); opacity: 0.92; }
            50% { transform: scale(1.05) rotate(2deg); opacity: 1; }
            100% { transform: scale(0.98) rotate(-1deg); opacity: 0.95; }
        }

        .smoke {
            opacity: 0;
            animation: riseSmoke 1.8s ease-out forwards;
        }

        @keyframes riseSmoke {
            0% { opacity: 0.6; transform: translateY(0) scaleX(1); }
            100% { opacity: 0; transform: translateY(-30px) scaleX(2.5); filter: blur(3px); }
        }

        /* Floating Balloon Animations */
        .balloon-float {
            animation: float 4s ease-in-out infinite alternate;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.3s ease;
        }
        .balloon-float:hover {
            transform: scale(1.1) translateY(-6px);
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-16px) rotate(3deg); }
        }

        #fxCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4 relative" onclick="handleGlobalClick(event)">

    <!-- MAIN CENTERED BIRTHDAY CARD -->

                Happy 18th Birthday,
            </h1>
            <h2 class="font-cinzel text-3xl sm:text-4xl font-extrabold text-gold-400 text-glow mt-1">
                Nhak Endric!

        </div>

        <!-- Sleek Clean SVG Cake -->
        <div class="my-4 flex justify-center items-center">
            <svg id="cakeSvg" class="w-52 h-48 sm:w-60 sm:h-56 transition-transform duration-300 hover:scale-105" viewBox="0 0 280 250">
                <defs>
                    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="0%">

                        <stop offset="100%" stop-color="#09090f" />

                <!-- Base Plate -->

                <!-- Bottom Tier -->

                <path d="M 45,160 Q 140,188 235,160" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="6,5"/>

                <!-- Frosting Accents -->

                <!-- CANDLES -->
                <g id="candle1" onclick="toggleCandle(1, event)" class="cursor-pointer">

                    <line x1="140" y1="50" x2="140" y2="43" stroke="#e5e7eb" stroke-width="1.5" />
                    <g id="flame2" class="flame">
                        <path d="M 140,43 C 134,32 136,23 140,14 C 144,23 146,32 140,43 Z" fill="#f59e0b" />
                        <path d="M 140,41 C 136,35 137,28 140,22 C 143,28 144,35 140,41 Z" fill="#fde047" />
                    </g>
                </g>

                <g id="candle3" onclick="toggleCandle(3, event)" class="cursor-pointer">
                    <rect x="177" y="60" width="8" height="46" rx="2" fill="url(#candleGrad)" stroke="#854d0e" stroke-width="0.5"/>
                    <line x1="181" y1="60" x2="181" y2="53" stroke="#e5e7eb" stroke-width="1.5" />
                    <g id="flame3" class="flame">
                        <path d="M 181,53 C 175,42 177,33 181,24 C 185,33 187,42 181,53 Z" fill="#f59e0b" />

        <!-- Super Clear Funny Greeting Message -->
        <div class="p-4 rounded-2xl bg-dark-900/90 border border-gray-800/80 mb-5">
            <p class="text-sm sm:text-base text-gray-200 leading-relaxed font-sans">
                "Congrats on turning 18! 🎉 You can now legally do adult stuff... <span class="text-gold-300 font-semibold">and legally get arrested!</span> Don't test it though! 😂🎂"
            </p>
        </div>

        <!-- Signature from mha mhia -->
        <div class="mb-5 text-sm sm:text-base font-semibold text-rose-400 tracking-wide">
            From mha mhia :)
        </div>

        <!-- Action Button -->
        <div class="flex justify-center items-center gap-3">
            <button id="blowBtn" onclick="toggleAllCandles(event)" class="px-6 py-3 rounded-xl bg-gradient-to-r from-gold-500 to-amber-500 hover:from-gold-400 hover:to-amber-400 text-black font-bold text-xs sm:text-sm uppercase tracking-wider transition-all shadow-lg shadow-gold-500/20 active:scale-95 flex items-center gap-2">
                <i class="fas fa-wind"></i>
                <span id="blowBtnText">Blow Out Candles</span>
            </button>
        </div>

    </main>

    <script>
        /* Audio Synthesizer */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'sparkle') {
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.2);
                    }, i * 70);
                });
            }
        }

        /* Candle Logic */
        const candleStates = { 1: true, 2: true, 3: true };

        function toggleCandle(id, event) {
            if (event) event.stopPropagation();
            playSound('sparkle');

            const flame = document.getElementById(`flame${id}`);
            const candleGroup = document.getElementById(`candle${id}`);

            if (candleStates[id]) {
                candleStates[id] = false;
                flame.style.display = 'none';

                // Smoke effect
                const smoke = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const posX = id === 1 ? "99" : (id === 2 ? "140" : "181");
                const posY = id === 2 ? "20" : "30";
                smoke.setAttribute("cx", posX);
                smoke.setAttribute("cy", posY);
                smoke.setAttribute("r", "4");
                smoke.setAttribute("fill", "#9ca3af");
                smoke.setAttribute("class", "smoke");
                candleGroup.appendChild(smoke);

                setTimeout(() => smoke.remove(), 1800);
            } else {
                candleStates[id] = true;
                flame.style.display = 'block';
            }

            updateCandleUI();
        }

        function toggleAllCandles(event) {
            if (event) event.stopPropagation();
            const anyLit = Object.values(candleStates).some(v => v === true);
            [1, 2, 3].forEach(id => {
                if (anyLit && candleStates[id]) {
                    toggleCandle(id);
                } else if (!anyLit && !candleStates[id]) {
                    toggleCandle(id);
                }
            });
        }

        function updateCandleUI() {
            const allOut = Object.values(candleStates).every(v => v === false);
            const btnText = document.getElementById('blowBtnText');

            if (allOut) {
                btnText.textContent = "Relight Candles";
                launchFireworksCluster();
            } else {
                btnText.textContent = "Blow Out Candles";
            }
        }

        /* Fireworks Canvas Animation */
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const colors = ['#facc15', '#eab308', '#a855f7', '#06b6d4', '#f43f5e', '#ffffff'];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.06;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            playSound('sparkle');
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 35; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function handleGlobalClick(e) {
            createFirework(e.clientX, e.clientY);
        }

        function launchFireworksCluster() {
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    const rx = Math.random() * (width * 0.6) + (width * 0.2);
                    const ry = Math.random() * (height * 0.4) + (height * 0.15);
                    createFirework(rx, ry);
                }, i * 200);
            }
        }

        function popBalloon(element, color, event) {
            if (event) event.stopPropagation();
            playSound('pop');
            const rect = element.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(cx, cy, color));
            }

            element.style.transform = 'scale(0)';
            element.style.opacity = '0';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
                element.style.opacity = '1';
            }, 3000);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
            setTimeout(launchFireworksCluster, 500);
        };
    </script>
</body>
</html>
